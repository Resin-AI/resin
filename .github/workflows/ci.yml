name: CI

# CI is deliberately minimal (static checks + unit tests). Don't add CI jobs,
# required checks or pre-push gates without the owner's approval. Removed checks
# still run by hand via their package.json scripts (see AGENTS.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs only; every push to main keeps its run because
# release-candidate.yml validates the CI run for the exact main SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Turbo's local cache, kept outside the checkout (so lint never sees it) and
  # persisted between runs with actions/cache.
  TURBO_CACHE_DIR: ${{ github.workspace }}/../turbo-cache
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turbo-static-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-static-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    name: Unit Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: resin_test
          POSTGRES_USER: resin_test
          POSTGRES_PASSWORD: resin_test_password
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    outputs:
      commit_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Setup pinned Deno for real broker tests
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "2.9.5"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turbo-unit-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-unit-${{ matrix.shard }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build workspace packages (turbo cache)
        run: pnpm build

      - name: Run unit test shard
        env:
          TEST_DATABASE_URL: postgresql://resin_test:resin_test_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/resin_test
        run: pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  ci-gate:
    name: CI Gate Rollup
    needs: [static, test-unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.gate.outputs.commit_sha }}
      status: ${{ steps.gate.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Verify static checks and every unit shard passed
        id: gate
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed=0
          for job in static test-unit; do
            result=$(jq -r ".[\"$job\"].result // \"missing\"" <<<"$RESULTS")
            sha=$(jq -r ".[\"$job\"].outputs.commit_sha // \"missing\"" <<<"$RESULTS")
            if [ "$result" != "success" ]; then
              echo "❌ $job: $result"; failed=1
            elif [ "$sha" != "$EXPECTED_SHA" ]; then
              echo "❌ $job ran against $sha, expected $EXPECTED_SHA"; failed=1
            else
              echo "✅ $job"
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "commit_sha=${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"
