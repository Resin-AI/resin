name: CI

# CI is deliberately small: static checks, repository gates, unit tests and the
# derivation sandbox suite. Don't add CI jobs, required checks or pre-push gates
# without the owner's approval. Release-only suites run in release-candidate.yml;
# the rest run by hand via their package.json scripts (see AGENTS.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs only; every push to main keeps its run because
# release-candidate.yml validates the CI run for the exact main SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Tests, qualification and smoke runs start real Resin binaries; they never send error reports
# or usage events (see docs/adr/0015-client-error-reporting.md).
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Repository-wide gates (Node built-ins only, before install): no private/cloud
      # imports across package boundaries, no committed credentials, ADR index integrity.
      - name: Check package boundaries
        run: node scripts/check-boundaries.mjs

      - name: Scan for committed secrets
        run: node scripts/check-secrets.mjs

      - name: Verify ADRs
        run: node scripts/verify-adrs.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      # Turbo's local cache, kept outside the checkout (so lint never sees it) and
      # persisted between runs with actions/cache.
      - name: Locate turbo cache
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-cache" >> "$GITHUB_ENV"

      # Sole writer of the shared compiler cache; other jobs restore it without
      # depending on this job, and Turbo content hashes decide what is reused.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-compile-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-compile-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    name: Unit Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    outputs:
      commit_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
          run_install: false

      - name: Setup pinned Deno for real broker tests
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "2.9.5"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      # Turbo's local cache, kept outside the checkout (so lint never sees it) and
      # persisted between runs with actions/cache.
      - name: Locate turbo cache
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-cache" >> "$GITHUB_ENV"

      # Static Checks writes the shared compiler cache; this job only restores it.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-compile-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-compile-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build workspace packages (turbo cache)
        run: pnpm build

      - name: Run unit test shard
        run: pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The derivation sandbox suites spawn real Deno sandboxes and are CPU-heavy, so
  # they run in their own job instead of loading the unit shards.
  test-sandbox:
    name: Sandbox Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
          run_install: false

      - name: Setup pinned Deno for real sandbox tests
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "2.9.5"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Locate turbo cache
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-cache" >> "$GITHUB_ENV"

      # Static Checks writes the shared compiler cache; this job only restores it.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-compile-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-compile-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build workspace packages (turbo cache)
        run: pnpm build

      - name: Run derivation sandbox tests
        run: pnpm test:sandbox

      - name: Verify the committed install helper matches the build
        run: node scripts/build-install-helper.mjs --check

  ci-gate:
    name: CI Gate Rollup
    needs: [static, test-unit, test-sandbox]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.gate.outputs.commit_sha }}
      status: ${{ steps.gate.outputs.status }}
    steps:
      - name: Verify every CI job passed
        id: gate
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed=0
          for job in static test-unit test-sandbox; do
            result=$(jq -r ".[\"$job\"].result // \"missing\"" <<<"$RESULTS")
            sha=$(jq -r ".[\"$job\"].outputs.commit_sha // \"missing\"" <<<"$RESULTS")
            if [ "$result" != "success" ]; then
              echo "❌ $job: $result"; failed=1
            elif [ "$sha" != "$EXPECTED_SHA" ]; then
              echo "❌ $job ran against $sha, expected $EXPECTED_SHA"; failed=1
            else
              echo "✅ $job"
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "commit_sha=${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"
