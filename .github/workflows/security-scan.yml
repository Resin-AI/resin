name: Production Security Scan

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact release candidate SHA to scan
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-security-scan-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: resin-vm-linux-arm64
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/security-scan
          pnpm audit --prod --audit-level high --json > dist/security-scan/pnpm-audit.json

      - name: Generate retained scan evidence
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          node --input-type=module -e '
            import crypto from "node:crypto";
            import fs from "node:fs";
            const audit = fs.readFileSync("dist/security-scan/pnpm-audit.json");
            const generatedAt = new Date();
            const parsed = JSON.parse(audit);
            const vulnerabilities = Object.values(parsed.vulnerabilities || {}).map((finding) => {
              const advisory = (finding.via || []).find((item) => typeof item === "object");
              return {
                id: String(advisory?.source || `pnpm:${finding.name || "unknown"}`),
                ratings: [{ severity: String(finding.severity || "unknown").toLowerCase() }],
                affects: [{ ref: finding.name || "unknown" }],
              };
            });
            const evidence = {
              schemaVersion: "1.0.0",
              source: "pnpm-audit",
              generatedAt: generatedAt.toISOString(),
              retentionUntil: new Date(generatedAt.getTime() + 365 * 24 * 60 * 60 * 1000).toISOString(),
              commitSha: process.env.RELEASE_SHA,
              dependencyScan: { status: "COMPLETED", rawSha256: crypto.createHash("sha256").update(audit).digest("hex") },
              containerScan: {
                status: "NOT_APPLICABLE",
                reason: "The public local-core release does not publish a container artifact",
              },
              vulnerabilities,
            };
            fs.writeFileSync("dist/security-scan/vulnerability-scan-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          '

      - name: Upload retained security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-scan-evidence
          path: dist/security-scan/
          if-no-files-found: error
          retention-days: 365
