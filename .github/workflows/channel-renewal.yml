name: Channel Metadata Freshness

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only check, renewal, expired-source restoration, or notification drill
        required: true
        default: check
        type: choice
        options:
          - check
          - renew
          - restore
          - notification-drill
      confirmation:
        description: RENEW_CHANNEL_PRODUCTION for renew; RESTORE_EXPIRED_CHANNEL_PRODUCTION for restore; NOTIFY_CHANNEL_MONITOR_DRILL for notification-drill
        required: false
        type: string
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

jobs:
  monitor:
    name: Check public channel expiry without credentials
    if: ${{ github.event_name == 'schedule' || inputs.operation == 'check' || inputs.operation == 'notification-drill' }}
    runs-on: resin-vm-linux-arm64
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate notification drill authorization
        id: drill-authorization
        if: ${{ inputs.operation == 'notification-drill' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$WORKFLOW_REF" != "refs/heads/main" ] || [ "$REF_PROTECTED" != "true" ] || [ "$CONFIRMATION" != "NOTIFY_CHANNEL_MONITOR_DRILL" ]; then
            echo "::error::Notification drill requires protected main and explicit NOTIFY_CHANNEL_MONITOR_DRILL confirmation."
            exit 1
          fi
      - name: Intentional diagnostic monitor failure (DRILL; no metadata changes)
        if: ${{ inputs.operation == 'notification-drill' }}
        shell: bash
        run: |
          echo "::error::DRILL: intentional monitor failure to exercise the incident notification route; no metadata was changed."
          exit 1
      - name: Checkout pinned public verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify public signatures and six-hour renewal headroom
        shell: bash
        run: |
          set -euo pipefail
          if ! node --experimental-strip-types scripts/publish-public-release.mjs check-channel-expiry; then
            echo "::error::Public channel freshness check failed. An authorized operator must inspect and renew metadata."
            echo "Public channel freshness check failed; operator action required." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Notification submission never changes this failed verification result.

  renew:
    name: Authorized channel-only metadata renewal
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'renew' || inputs.operation == 'restore') }}
    runs-on: resin-vm-linux-arm64
    timeout-minutes: 15
    environment: production
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate explicit authorization before assuming credentials
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM_RENEWAL: ${{ inputs.confirmation }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "::error::Renewal requires a protected workflow ref and production environment approval."
            exit 1
          fi
          if [ "$OPERATION" = "renew" ]; then
            expected="RENEW_CHANNEL_PRODUCTION"
          elif [ "$OPERATION" = "restore" ]; then
            expected="RESTORE_EXPIRED_CHANNEL_PRODUCTION"
          else
            exit 1
          fi
          if [ "$CONFIRM_RENEWAL" != "$expected" ]; then
            echo "::error::Explicit channel renewal confirmation is missing or incorrect."
            exit 1
          fi
      - name: Checkout approved public renewal implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Assume approved channel renewal role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.RESIN_CHANNEL_RENEWAL_ROLE_ARN }}
          aws-region: us-east-1
      - name: Renew only signed channel freshness and verify canonical readback
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM_RENEWAL: ${{ inputs.confirmation }}
          RESIN_DISTRIBUTION_BUCKET: ${{ secrets.RESIN_DISTRIBUTION_BUCKET }}
          RESIN_DISTRIBUTION_ID: ${{ secrets.RESIN_DISTRIBUTION_ID }}
          RESIN_RELEASE_KEY_ID: ${{ vars.RESIN_RELEASE_KEY_ID }}
          RESIN_RELEASE_PUBLIC_KEY_PEM: ${{ vars.RESIN_RELEASE_PUBLIC_KEY_PEM }}
          RESIN_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.RESIN_RELEASE_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          args=()
          if [ "$OPERATION" = "restore" ]; then
            args+=(--restore-expired)
          fi
          node --experimental-strip-types scripts/publish-public-release.mjs renew-channel \
            --confirmation "$CONFIRM_RENEWAL" "${args[@]}" \
            | tee "$RUNNER_TEMP/channel-renewal-receipt.json"
          cat "$RUNNER_TEMP/channel-renewal-receipt.json" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Submit channel failure notification (SNS submission only)
    needs: [monitor, renew]
    # always() is required: one of these mutually exclusive dependencies is skipped.
    # Reject unauthorized drills here as well as in monitor, before accessing credentials.
    if: >-
      ${{ always() &&
          (needs.monitor.result == 'failure' || needs.renew.result == 'failure') &&
          github.ref == 'refs/heads/main' && github.ref_protected == true &&
          (inputs.operation != 'notification-drill' ||
           (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'NOTIFY_CHANNEL_MONITOR_DRILL')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-monitoring
    permissions:
      id-token: write
    steps:
      - name: Validate notification configuration before assuming credentials
        shell: bash
        env:
          NOTIFICATION_ROLE: ${{ secrets.RESIN_CHANNEL_NOTIFICATION_ROLE_ARN }}
          NOTIFICATION_TOPIC: ${{ secrets.RESIN_CHANNEL_NOTIFICATION_TOPIC_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$NOTIFICATION_ROLE" ] || [ -z "$NOTIFICATION_TOPIC" ]; then
            echo "::error::Channel notification configuration is missing; no submission occurred."
            exit 1
          fi
      - name: Assume notification-only role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.RESIN_CHANNEL_NOTIFICATION_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Submit notification and record safe submission receipt
        id: submission
        shell: python
        env:
          NOTIFICATION_TOPIC: ${{ secrets.RESIN_CHANNEL_NOTIFICATION_TOPIC_ARN }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_PROTECTED: ${{ github.ref_protected }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
          RENEW_RESULT: ${{ needs.renew.result }}
        run: |
          import datetime
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          def timestamp():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()

          drill = os.environ.get("OPERATION") == "notification-drill"
          if (os.environ.get("GITHUB_REF") != "refs/heads/main"
              or os.environ.get("REF_PROTECTED") != "true"
              or (drill and (os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
                            or os.environ.get("CONFIRMATION") != "NOTIFY_CHANNEL_MONITOR_DRILL"))):
              sys.exit("Notification authorization rejected; no submission occurred.")
          results = {"monitor": os.environ["MONITOR_RESULT"], "renew": os.environ["RENEW_RESULT"]}
          if "failure" not in results.values():
              sys.exit("Notification requires a failed monitor or renewal job.")
          classification = "drill" if drill else "incident"
          receipt = {
              "schemaVersion": 1,
              "classification": classification,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"],
              "runUrl": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "jobResults": results,
              "startedAt": timestamp(),
              "submissionStatus": "failed",
              "snsMessageId": None,
              "submittedAt": None,
              "humanDelivery": "not_verified",
              "humanAcknowledgment": "not_verified",
          }
          message = {
              "type": "resin.channel.notification.v1",
              "classification": classification,
              "summary": ("DRILL: intentional channel monitor failure; no metadata changed."
                          if drill else "INCIDENT: channel freshness verification or renewal failed; operator action required."),
              "runUrl": receipt["runUrl"],
              "runId": receipt["runId"],
              "runAttempt": receipt["runAttempt"],
              "jobResults": results,
              "startedAt": receipt["startedAt"],
          }
          try:
              topic = os.environ.get("NOTIFICATION_TOPIC", "")
              if not topic:
                  raise ValueError("Missing notification topic")
              response = subprocess.run(
                  ["aws", "sns", "publish", "--topic-arn", topic,
                   "--subject", f"Resin channel {classification.upper()}",
                   "--message", json.dumps(message), "--output", "json", "--no-cli-pager"],
                  capture_output=True, text=True, check=True, timeout=60,
              )
              message_id = json.loads(response.stdout).get("MessageId")
              if not isinstance(message_id, str) or not re.fullmatch(
                  r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", message_id
              ):
                  raise ValueError("Invalid SNS submission response")
              receipt.update(submissionStatus="submitted", snsMessageId=message_id, submittedAt=timestamp())
          except Exception:
              # Never echo provider errors, endpoints, topic ARNs, or credentials.
              print("::error::Channel notification submission failed or could not be confirmed.")
          receipt["completedAt"] = timestamp()
          pathlib.Path(os.environ["RUNNER_TEMP"], "channel-notification-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Channel {classification}: SNS submission {receipt['submissionStatus']}; human delivery and acknowledgment NOT VERIFIED.\n")
          sys.exit(0 if receipt["submissionStatus"] == "submitted" else 1)
      - name: Upload notification submission receipt
        if: ${{ always() && steps.submission.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: channel-notification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel-notification-receipt.json
          if-no-files-found: error
          retention-days: 30
