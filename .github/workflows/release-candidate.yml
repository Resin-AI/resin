name: Release Candidate

# One dispatch per release, sent as soon as the commit lands on main. Platform and
# system qualification run here, in parallel, against the exact commit; the ci.yml
# push run for the same commit runs concurrently and release.yml refuses to
# promote until that recorded CI run has completed successfully.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit SHA to build release candidate for
        required: true
        type: string
      release_tag:
        description: Exact protected release tag for this candidate
        required: true
        type: string
      ci_run_id:
        description: GitHub Actions run ID of the ci.yml push run on exact commit_sha (may still be running; release.yml requires it to succeed)
        required: true
        type: string

concurrency:
  group: release-candidate-${{ inputs.commit_sha }}
  cancel-in-progress: false

# Tests, qualification and smoke runs start real Resin binaries; they never send error reports
# or usage events (see docs/adr/0015-client-error-reporting.md).
env:
  DO_NOT_TRACK: "1"

jobs:
  platform-qualification:
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - lanes: linux-x64
            check_name: Qualify linux-x64
            mode: native
            runner: ubuntu-latest
          - lanes: linux-arm64
            check_name: Qualify linux-arm64
            mode: native
            runner: ubuntu-24.04-arm
          - lanes: darwin-x64 darwin-arm64 wsl
            check_name: Validate darwin-x64, darwin-arm64 and wsl artifacts
            mode: artifact
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RESIN_RELEASE_TEST_ONLY: "1"
      RELEASE_SHA: ${{ inputs.commit_sha }}
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - name: Locate turbo cache
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-cache" >> "$GITHUB_ENV"

      - name: Restore turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-release-${{ inputs.commit_sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-release-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact candidate
        run: pnpm build

      - name: Package signed test-domain release candidate
        run: pnpm release:package

      - name: Validate artifact or exercise native packaged stack on GitHub-hosted Linux
        shell: bash
        env:
          LANES: ${{ matrix.lanes }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          for lane in $LANES; do
            node scripts/platform-qualification.mjs --lane="$lane" --mode="$MODE" \
              --release-dir=dist/release/v1.0.3 --output-dir=dist/qualification
            mkdir -p dist/platform-evidence
            cp "dist/qualification/$lane.json" dist/platform-evidence/
          done

      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-qualification-${{ strategy.job-index }}
          path: dist/platform-evidence/
          if-no-files-found: error
          retention-days: 30

  # Native Windows (no WSL) on GitHub-hosted x64 and arm64 runners. Every step runs in
  # PowerShell (pwsh, or Windows PowerShell 5.1 where the step says so), never Git Bash.
  # The lane builds its own-arch native prebuilds, packages the test-signed candidate,
  # qualifies the extracted artifact (named-pipe daemon, Scheduled Task lifecycle, crash
  # restart), runs the Windows suites, installs through install.ps1, proves a second local
  # user can reach neither the daemon pipe nor the private files, then uninstalls and checks
  # nothing is left. The signing job packages the prebuilds uploaded here.
  windows-qualification:
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - lane: windows-x64
            arch: x64
            check_name: Qualify windows-x64
            runner: windows-latest
          - lane: windows-arm64
            arch: arm64
            check_name: Qualify windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      RESIN_RELEASE_TEST_ONLY: "1"
      RELEASE_SHA: ${{ inputs.commit_sha }}
      TURBO_TELEMETRY_DISABLED: "1"
      LANE: ${{ matrix.lane }}
      ARCH: ${{ matrix.arch }}
      RELEASE_DIR: dist/release/v1.0.3
      PROBE_USER: resinprobe
      # Windows-specific suites that must pass natively (IPC/pipe and private-file ACLs,
      # Scheduled Task service, PowerShell learn/replay, capture, scrubbing, installer).
      WINDOWS_SUITES: >-
        packages/windows-security/tests/portable.test.ts
        packages/windows-security/tests/windows.test.ts
        packages/crypto/tests/vault.test.ts
        apps/observer/tests/paths.test.ts
        apps/observer/tests/ipc.test.ts
        apps/observer/tests/lock.test.ts
        apps/observer/tests/config.test.ts
        apps/observer/tests/cloud-credentials.test.ts
        apps/observer/tests/cloud-auth-recovery.test.ts
        apps/observer/tests/recovery-healing.test.ts
        apps/observer/tests/analytics/immutable-private-store.test.ts
        apps/observer/tests/analytics/shell-dialect-capture.test.ts
        apps/observer/tests/normalization/upload-redaction-gaps.test.ts
        apps/observer/tests/normalization/windows-identity-redaction.test.ts
        apps/cli/tests/service/windows-task.test.ts
        apps/cli/tests/service/windows-task.win32.test.ts
        apps/cli/tests/service/windows-supervisor.test.ts
        apps/cli/tests/installer/harness-mcp-launch.test.ts
        apps/cli/tests/installer/harness-uninstall-windows.test.ts
        apps/cli/tests/installer/windows-activation.test.ts
        apps/gateway/tests/proxy/powershell-learn-replay.test.ts
        apps/gateway/tests/proxy/local-artifact-trust.test.ts
        packages/runtime/tests/workflow/shell-dialect-runner.test.ts
        packages/contracts/tests/powershell-tokens.test.ts
        packages/contracts/tests/harness-introspection-windows-home.test.ts
        packages/harness-contracts/tests/windows-host.test.ts
        adapters/claude-code/tests/windows-capture.test.ts
        adapters/codex-cli/tests/windows-capture.test.ts
        adapters/omp/tests/windows-capture.test.ts
        scripts/harness-fixtures/scrub.test.mjs
        scripts/install-ps1.test.mjs
        scripts/windows-lane.test.mjs
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify checkout identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw "Invalid commit SHA: $env:RELEASE_SHA" }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_SHA) { throw "Checked out $head, expected $env:RELEASE_SHA" }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - name: Locate turbo cache
        run: Add-Content -Path $env:GITHUB_ENV -Value "TURBO_CACHE_DIR=$env:RUNNER_TEMP\turbo-cache" -Encoding utf8

      - name: Restore turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-release-${{ inputs.commit_sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-release-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native Windows prebuilds for this architecture
        run: |
          node packages/windows-security/scripts/build-native.mjs --arch $env:ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "packages/windows-security/prebuilds/win32-$env:ARCH" | Format-Table Name, Length

      - name: Build exact candidate
        run: pnpm build

      - name: Package signed test-domain release candidate
        run: pnpm release:package

      - name: Qualify the packaged artifact natively (launchers, named pipe, ACLs, capture)
        run: |
          node scripts/platform-qualification.mjs --lane=$env:LANE --mode=native `
            --release-dir=$env:RELEASE_DIR --output-dir=dist/qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native Windows qualification suites
        run: |
          $suites = $env:WINDOWS_SUITES -split '\s+' | Where-Object { $_ }
          $missing = $suites | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Windows qualification suites missing: $($missing -join ', ')" }
          pnpm exec vitest run --no-file-parallelism @suites
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch the pinned Deno runtime for the candidate
        run: |
          $runtimes = Join-Path $env:RUNNER_TEMP 'deno-runtime'
          node scripts/windows-lane.mjs fetch-runtime --lane $env:LANE --out $runtimes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "DENO_RUNTIME_DIR=$runtimes"

      # Windows PowerShell 5.1 is what a clean Windows 10/11 machine runs the one-liner in.
      # The loopback release server lives inside this step: a process started in an earlier
      # step does not outlive that step's console on Windows runners.
      - name: Install with install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $portFile = Join-Path $env:RUNNER_TEMP 'release-server.port'
          $serverLog = Join-Path $env:RUNNER_TEMP 'release-server.log'
          Remove-Item $portFile -ErrorAction SilentlyContinue
          $server = Start-Process -FilePath node -WindowStyle Hidden -PassThru `
            -RedirectStandardOutput $serverLog -RedirectStandardError "$serverLog.err" -ArgumentList @(
              'scripts/windows-lane.mjs', 'serve', '--release-dir', $env:RELEASE_DIR,
              '--runtime-dir', $env:DENO_RUNTIME_DIR, '--port-file', $portFile)
          try {
            for ($i = 0; $i -lt 100 -and -not (Test-Path $portFile); $i++) { Start-Sleep -Milliseconds 100 }
            if (-not (Test-Path $portFile)) { throw 'Release server did not start' }
            $port = (Get-Content $portFile -Raw).Trim()
            $channelUrl = "http://127.0.0.1:$port/releases/v1/channels.json"
            # Fail here, with the server's log, if the channel is not being served.
            $null = Invoke-WebRequest -UseBasicParsing -Uri $channelUrl -TimeoutSec 10
            $env:RESIN_INSTALL_TEST_ONLY = '1'
            $env:RESIN_INSTALL_HELPER_PATH = (Resolve-Path 'apps/cli/install/install-helper-v1.mjs').Path
            $env:RESIN_INSTALL_TRUSTED_KEYS_JSON = (Resolve-Path "$env:RELEASE_DIR/release-trust.json").Path
            & ./apps/cli/install/install.ps1 -ChannelUrl $channelUrl -NonInteractive -NoOnboarding
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          } catch {
            Get-Content $serverLog, "$serverLog.err" -ErrorAction SilentlyContinue
            throw
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "$env:USERPROFILE\.resin\bin\resin.cmd")) { throw 'install.ps1 did not install resin.cmd' }
          $version = (& "$env:USERPROFILE\.resin\bin\resin.cmd" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '1\.0\.3') { throw "Installed resin --version returned '$version'" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$env:USERPROFILE\.resin\bin*") { throw 'install.ps1 did not add resin to the user PATH' }

      # init registers the Scheduled Task; the lifecycle (logon trigger, least privilege, no
      # time limit, pipe ownership, crash restart, stop/start) is recorded in the lane evidence.
      - name: resin init registers the Scheduled Task service; crash restart and stop/start
        run: |
          node scripts/platform-qualification.mjs --lane=$env:LANE --windows-service `
            --resin-home="$env:USERPROFILE\.resin" --output-dir=dist/qualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: resin status reports healthy
        run: |
          $resin = "$env:USERPROFILE\.resin\bin\resin.cmd"
          # The overall status was required to be "healthy" before the crash test (evidence
          # checks.windowsService.statusHealthy); the crash keeps the recovery record degraded
          # for its window, so here the service, pipe and daemon health must be back.
          $deadline = (Get-Date).AddSeconds(90)
          do {
            $status = & $resin status --json | Out-String | ConvertFrom-Json
            if ($status.service.active -and $status.ipc.responsive -and $status.daemon.health -eq 'healthy') { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          $status | ConvertTo-Json -Depth 6
          if ($status.service.platform -ne 'windows-task') { throw "Service backend is $($status.service.platform)" }
          if (-not ($status.service.active -and $status.ipc.responsive -and $status.daemon.health -eq 'healthy')) {
            throw 'resin status is not healthy after init'
          }
          $task = Get-ScheduledTask -TaskPath '\Resin\' -TaskName 'ResinDaemon'
          if ($task.Principal.RunLevel -ne 'Limited') { throw "Task run level $($task.Principal.RunLevel)" }
          # Recorded for the run log; health is gated on `resin status` above.
          & $resin doctor --json
          exit 0

      - name: A second local user cannot open the daemon pipe or read private files
        run: |
          $ErrorActionPreference = 'Stop'
          $resinHome = "$env:USERPROFILE\.resin"
          $pipe = (node scripts/windows-lane.mjs pipe-name --resin-home $resinHome).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Plain files the daemon never holds exclusively (so the owner control can read them).
          $files = @(Get-ChildItem -File -Recurse "$resinHome\config", "$resinHome\state" -Include *.json, *.pid, *.toml -ErrorAction SilentlyContinue |
            Select-Object -First 8 -ExpandProperty FullName)
          if ($files.Count -eq 0) { throw "No private files found under $resinHome" }
          $targets = @('--endpoint', $pipe, '--dir', $resinHome, '--dir', "$resinHome\state")
          foreach ($file in $files) { $targets += @('--file', $file) }

          # Positive control: the owner reaches every target.
          node scripts/windows-isolation-probe.mjs @targets --expect allowed
          if ($LASTEXITCODE -ne 0) { throw 'Owner could not reach its own daemon pipe or files' }

          # The probe runs from a directory the second user can read, with its own node.exe.
          $probeDir = 'C:\ResinProbe'
          New-Item -ItemType Directory -Force $probeDir | Out-Null
          Copy-Item (Get-Command node).Source "$probeDir\node.exe"
          Copy-Item scripts/windows-isolation-probe.mjs "$probeDir\probe.mjs"
          $bytes = [byte[]]::new(24)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = 'Rp9!' + ([Convert]::ToBase64String($bytes) -replace '[+/=]', 'x')
          # /y answers net's "longer than 14 characters" confirmation, which fails without a console.
          net user $env:PROBE_USER $password /add /expires:never /y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not create local user $env:PROBE_USER" }
          icacls $probeDir /grant "${env:PROBE_USER}:(OI)(CI)M" | Out-Null
          $credential = [pscredential]::new($env:PROBE_USER, (ConvertTo-SecureString $password -AsPlainText -Force))
          $result = "$probeDir\result.json"
          $arguments = @("$probeDir\probe.mjs") + $targets + @('--expect', 'denied', '--out', $result) |
            ForEach-Object { '"{0}"' -f $_ }
          $probe = Start-Process -FilePath "$probeDir\node.exe" -ArgumentList $arguments -Credential $credential `
            -WorkingDirectory $probeDir -LoadUserProfile -Wait -PassThru `
            -RedirectStandardOutput "$probeDir\stdout.txt" -RedirectStandardError "$probeDir\stderr.txt"
          Get-Content "$probeDir\stdout.txt", "$probeDir\stderr.txt" -ErrorAction SilentlyContinue
          if (-not (Test-Path $result)) { throw 'Second-user probe produced no result' }
          $outcome = Get-Content $result -Raw | ConvertFrom-Json
          # Identity comes from the probe's process token (its environment is the runner's).
          $ownerSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $probeName = ([string]$outcome.account).Split('\')[-1]
          if ($outcome.user -ne $env:PROBE_USER -or $probeName -ne $env:PROBE_USER -or -not $outcome.sid -or $outcome.sid -eq $ownerSid) {
            throw "Probe ran as '$($outcome.account)' ($($outcome.sid)), not $env:PROBE_USER"
          }
          if ($probe.ExitCode -ne 0 -or -not $outcome.ok) {
            throw "Second user reached Resin: $($outcome.failures -join '; ')"
          }
          New-Item -ItemType Directory -Force dist/platform-evidence | Out-Null
          Copy-Item $result dist/platform-evidence/$env:LANE-second-user-isolation.json

      - name: resin uninstall leaves nothing behind
        run: |
          $ErrorActionPreference = 'Stop'
          $resinHome = "$env:USERPROFILE\.resin"
          & "$resinHome\bin\resin.cmd" uninstall --non-interactive --purge-all --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Uninstall hands the home (including the running launcher) to a hidden cleanup that
          # deletes it once uninstall has exited; give that cleanup time to finish.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            $pending = (Test-Path $resinHome) -or
              @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*\.resin\*' }).Count -gt 0
          } while ($pending -and (Get-Date) -lt $deadline)
          $left = @()
          if (Get-ScheduledTask -TaskPath '\Resin\' -ErrorAction SilentlyContinue) { $left += 'Scheduled Task \Resin\' }
          if (Test-Path $resinHome) { $left += "$resinHome ($((Get-ChildItem -Recurse -Force $resinHome | Measure-Object).Count) entries)" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -like '*\.resin\*') { $left += "user PATH entry ($userPath)" }
          $procs = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*\.resin\*' -or $_.Name -eq 'resin-service-host.exe' }
          if ($procs) { $left += "processes: $(($procs | ForEach-Object { "$($_.ProcessId) $($_.Name)" }) -join ', ')" }
          if ($left.Count -gt 0) { throw "resin uninstall left: $($left -join '; ')" }
          'resin uninstall removed the service, home, PATH entry and processes.'

      - name: Collect lane evidence
        if: always()
        run: |
          New-Item -ItemType Directory -Force dist/platform-evidence | Out-Null
          if (Test-Path "dist/qualification/$env:LANE.json") {
            Copy-Item "dist/qualification/$env:LANE.json" dist/platform-evidence/
          }

      - name: Clean up probe user and release server
        if: always()
        run: |
          net user $env:PROBE_USER /delete 2>$null | Out-Null
          Remove-Item -Recurse -Force C:\ResinProbe -ErrorAction SilentlyContinue
          if ($env:RELEASE_SERVER_PID) { Stop-Process -Id $env:RELEASE_SERVER_PID -Force -ErrorAction SilentlyContinue }
          exit 0

      - name: Upload qualified native prebuilds for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-prebuilds-${{ matrix.arch }}
          path: packages/windows-security/prebuilds/
          if-no-files-found: error
          retention-days: 30

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-qualification-${{ matrix.lane }}
          path: dist/platform-evidence/
          if-no-files-found: error
          retention-days: 30

  system-qualification:
    name: Clean Checkout Public Core System Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RESIN_RELEASE_TEST_ONLY: "1"
      RELEASE_SHA: ${{ inputs.commit_sha }}
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - name: Locate turbo cache
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-cache" >> "$GITHUB_ENV"

      - name: Restore turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-release-${{ inputs.commit_sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-release-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact candidate
        run: pnpm build

      # The suites don't read the packaged release, so package and verify it
      # concurrently; the evidence is bound to it once both have finished.
      - name: Package release candidate and run release-bound public core qualification
        shell: bash
        run: |
          set -euo pipefail
          ready="$RUNNER_TEMP/release-ready"
          ( set +e; pnpm release:package && pnpm release:verify; echo $? > "$ready" ) > "$RUNNER_TEMP/package.log" 2>&1 &
          package_pid=$!
          status=0
          node scripts/system-qualification.mjs \
            --release-dir=dist/release/v1.0.3 \
            --output=dist/qualification/system-e2e.json \
            --commit-sha="$RELEASE_SHA" \
            --release-ready-file="$ready" || status=$?
          wait "$package_pid" || true
          cat "$RUNNER_TEMP/package.log"
          exit "$status"

      - name: Upload system qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-qualification-evidence
          path: dist/qualification/system-e2e.json
          if-no-files-found: error
          retention-days: 30

  build-and-sign:
    name: Build and Sign Candidate
    needs: [platform-qualification, windows-qualification, system-qualification]
    runs-on: resin-ovh-linux-x64
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: none
    env:
      RELEASE_SHA: ${{ inputs.commit_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RESIN_RELEASE_KEY_ID: ${{ vars.RESIN_RELEASE_KEY_ID }}
      RESIN_RELEASE_PUBLIC_KEY_PEM: ${{ vars.RESIN_RELEASE_PUBLIC_KEY_PEM }}
      RESIN_RELEASE_ADDITIONAL_TRUSTED_KEYS_JSON: ${{ vars.RESIN_RELEASE_ADDITIONAL_TRUSTED_KEYS_JSON }}
      RESIN_RELEASE_EVIDENCE_PATH: dist/qualification/production-release-evidence.json
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify exact commit SHA and CI run identity
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid commit SHA format: $RELEASE_SHA"
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag format: $RELEASE_TAG"
            exit 1
          fi

          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$RELEASE_SHA" ]; then
            echo "::error::Checked out HEAD ($actual_head) does not match requested commit SHA ($RELEASE_SHA)"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_target" != "$RELEASE_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG points to $tag_target, not candidate SHA $RELEASE_SHA"
              exit 1
            fi
          fi

          node --input-type=module -e '
            import { REVOKED_RELEASE_KEY_IDS } from "./scripts/release-trust.mjs";
            const privateKey = process.env.RESIN_RELEASE_PRIVATE_KEY_PEM || "";
            if (privateKey && privateKey.includes("resin-release-v1")) {
              console.error("::error::Revoked signing key rejected for candidate build");
              process.exit(1);
            }
          '

          # The CI run may still be in progress (it runs concurrently with this
          # workflow); a finished run must have succeeded. The next step waits for
          # it to succeed before any evidence is generated, and release.yml
          # re-checks it before promotion.
          validate_run() {
            local run_id="$1"
            local expected_path="$2"
            local label="$3"
            local run_info

            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::$label run ID must be digits: $run_id"
              exit 1
            fi

            echo "Validating $label (run $run_id)..."
            run_info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            run_repo="$(echo "$run_info" | jq -r '.head_repository.full_name // (.head_repository_owner.login + "/" + .head_repository.name)')"
            run_path="$(echo "$run_info" | jq -r '.path')"
            run_sha="$(echo "$run_info" | jq -r '.head_sha')"
            run_event="$(echo "$run_info" | jq -r '.event')"
            run_branch="$(echo "$run_info" | jq -r '.head_branch')"
            run_status="$(echo "$run_info" | jq -r '.status')"
            run_conclusion="$(echo "$run_info" | jq -r '.conclusion')"

            if [ "$run_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::$label run $run_id repository ($run_repo) does not match $GITHUB_REPOSITORY"
              exit 1
            fi

            if [ "$run_path" != "$expected_path" ]; then
              echo "::error::$label run $run_id workflow path ($run_path) does not match expected ($expected_path)"
              exit 1
            fi

            if [ "$run_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$label run $run_id head SHA ($run_sha) does not match release SHA ($RELEASE_SHA)"
              exit 1
            fi

            if [ "$run_event" != "push" ] || [ "$run_branch" != "main" ]; then
              echo "::error::$label run $run_id is a $run_event run on $run_branch (must be a push to main)"
              exit 1
            fi

            if [ "$run_status" = "completed" ] && [ "$run_conclusion" != "success" ]; then
              echo "::error::$label run $run_id conclusion is $run_conclusion (must be success)"
              exit 1
            fi
            echo "$label run $run_id accepted ($run_status)"
          }

          validate_run "$CI_RUN_ID" ".github/workflows/ci.yml" "CI suite"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact-SHA CI run to succeed
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while :; do
            run_info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
            run_repo="$(echo "$run_info" | jq -r '.head_repository.full_name // (.head_repository_owner.login + "/" + .head_repository.name)')"
            run_path="$(echo "$run_info" | jq -r '.path')"
            run_sha="$(echo "$run_info" | jq -r '.head_sha')"
            run_event="$(echo "$run_info" | jq -r '.event')"
            run_branch="$(echo "$run_info" | jq -r '.head_branch')"
            run_status="$(echo "$run_info" | jq -r '.status')"
            run_conclusion="$(echo "$run_info" | jq -r '.conclusion')"
            if [ "$run_repo" != "$GITHUB_REPOSITORY" ] || [ "$run_path" != ".github/workflows/ci.yml" ] || [ "$run_sha" != "$RELEASE_SHA" ] || [ "$run_event" != "push" ] || [ "$run_branch" != "main" ]; then
              echo "::error::CI run $CI_RUN_ID ($run_repo $run_path $run_event $run_branch $run_sha) is not the ci.yml push to main on $RELEASE_SHA"
              exit 1
            fi
            if [ "$run_status" = "completed" ]; then
              if [ "$run_conclusion" != "success" ]; then
                echo "::error::CI run $CI_RUN_ID concluded $run_conclusion (must be success)"
                exit 1
              fi
              echo "CI run $CI_RUN_ID succeeded on $RELEASE_SHA"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::CI run $CI_RUN_ID still $run_status after 15 minutes"
              exit 1
            fi
            sleep 5
          done

      - name: Download platform qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: platform-qualification-*
          merge-multiple: true
          path: dist/upstream-qualification/platform

      - name: Download system qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: system-qualification-evidence
          path: dist/upstream-qualification/system

      - name: Download qualified Windows native prebuilds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: windows-prebuilds-*
          merge-multiple: true
          path: packages/windows-security/prebuilds

      - name: Require evidence for every qualification lane
        shell: bash
        run: |
          set -euo pipefail
          for lane in linux-x64 linux-arm64 darwin-x64 darwin-arm64 wsl windows-x64 windows-arm64; do
            test -s "dist/upstream-qualification/platform/$lane.json"
          done
          for lane in windows-x64 windows-arm64; do
            test -s "dist/upstream-qualification/platform/$lane-second-user-isolation.json"
          done
          test -s dist/upstream-qualification/system/system-e2e.json

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify staged Windows prebuilds are the bytes the Windows lanes qualified
        shell: bash
        run: |
          set -euo pipefail
          node scripts/windows-lane.mjs verify-prebuilds \
            --evidence-dir dist/upstream-qualification/platform \
            --prebuilds-dir packages/windows-security/prebuilds

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/security-scan
          pnpm audit --prod --audit-level high --json > dist/security-scan/pnpm-audit.json

      - name: Generate retained vulnerability scan evidence
        run: |
          node --input-type=module -e '
            import crypto from "node:crypto";
            import fs from "node:fs";
            const audit = fs.readFileSync("dist/security-scan/pnpm-audit.json");
            const generatedAt = new Date();
            const parsed = JSON.parse(audit);
            const vulnerabilities = Object.values(parsed.vulnerabilities || {}).map((finding) => {
              const advisory = (finding.via || []).find((item) => typeof item === "object");
              return {
                id: String(advisory?.source || `pnpm:${finding.name || "unknown"}`),
                ratings: [{ severity: String(finding.severity || "unknown").toLowerCase() }],
                affects: [{ ref: finding.name || "unknown" }],
              };
            });
            const evidence = {
              schemaVersion: "1.0.0",
              source: "pnpm-audit",
              generatedAt: generatedAt.toISOString(),
              retentionUntil: new Date(generatedAt.getTime() + 365 * 24 * 60 * 60 * 1000).toISOString(),
              commitSha: process.env.RELEASE_SHA,
              dependencyScan: { status: "COMPLETED", rawSha256: crypto.createHash("sha256").update(audit).digest("hex") },
              containerScan: {
                status: "NOT_APPLICABLE",
                reason: "The public local-core release does not publish a container artifact",
              },
              vulnerabilities,
            };
            fs.writeFileSync("dist/security-scan/vulnerability-scan-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          '
          test -s dist/security-scan/vulnerability-scan-evidence.json

      - name: Generate production qualification evidence
        run: >-
          node scripts/generate-production-qualification-evidence.mjs
          --ci-run-id=${{ steps.gates.outputs.ci_run_id }}
          --platform-run-id=${{ github.run_id }}
          --system-run-id=${{ github.run_id }}
          --security-run-id=${{ github.run_id }}
          --commit-sha=$RELEASE_SHA
          --output=$RESIN_RELEASE_EVIDENCE_PATH

      - name: Require qualification for every production platform
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const evidence = JSON.parse(fs.readFileSync(process.env.RESIN_RELEASE_EVIDENCE_PATH, "utf8"));
            const lanes = new Map(
              (evidence.qualification?.platforms?.lanes || []).map((lane) => [lane.id, lane]),
            );
            const required = {
              "darwin-arm64": ["QUALIFIED", "ARTIFACT_VALIDATED"],
              "darwin-x64": ["QUALIFIED", "ARTIFACT_VALIDATED"],
              "linux-arm64": ["QUALIFIED", "ARTIFACT_VALIDATED"],
              "linux-x64": ["QUALIFIED", "ARTIFACT_VALIDATED"],
              "windows-arm64": ["QUALIFIED"],
              "windows-x64": ["QUALIFIED"],
            };
            for (const [platform, accepted] of Object.entries(required)) {
              const status = lanes.get(platform)?.status;
              if (!accepted.includes(status)) {
                console.error(`::error::Platform ${platform} qualification status is ${status || "missing"}`);
                process.exit(1);
              }
            }
          '

      - name: Package exact production-signed release
        env:
          RESIN_VULNERABILITY_SCAN_PATH: dist/security-scan/vulnerability-scan-evidence.json
          RESIN_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.RESIN_RELEASE_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-release.mjs

      - name: Package public fallback tarballs
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/release-packages"
          pnpm run release:packages -- \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --output-dir "$package_dir"
          test -s "$package_dir/packages-manifest.json"
          mapfile -t package_tarballs < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#package_tarballs[@]}" -ne 20 ]; then
            echo "::error::Expected exactly 20 public fallback package tarballs, found ${#package_tarballs[@]}"
            exit 1
          fi

      - name: Mirror runtime sources upstream
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-public-release.mjs mirror-runtimes --dist-dir "dist/release/${RELEASE_TAG}"
      - name: Stage and verify all pinned runtime archives
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="dist/runtimes/deno-v2.9.5"
          release_dir="dist/release/${RELEASE_TAG}"
          mapfile -t runtimes < <(find "$runtime_dir" -maxdepth 1 -type f -name '*.zip' -print)
          if [ "${#runtimes[@]}" -ne 6 ]; then
            echo "::error::Expected exactly six pinned Deno runtime ZIPs, found ${#runtimes[@]}"
            exit 1
          fi
          cp "${runtimes[@]}" "$release_dir/"
          for runtime in "${runtimes[@]}"; do
            test -s "$release_dir/$(basename "$runtime")"
          done

      - name: Verify candidate integrity and signatures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-public-release.mjs verify-candidate --dist-dir "dist/release/${RELEASE_TAG}"

      - name: Assemble deterministic release candidate archive
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying deterministic install helper build and pinned digests..."
          node scripts/build-install-helper.mjs --check

          node --input-type=module -e '
            import crypto from "node:crypto";
            import fs from "node:fs";

            const helperContent = fs.readFileSync("apps/cli/install/install-helper-v1.mjs");
            const helperSha = crypto.createHash("sha256").update(helperContent).digest("hex");

            const shContent = fs.readFileSync("apps/cli/install/install.sh", "utf8");
            const ps1Content = fs.readFileSync("apps/cli/install/install.ps1", "utf8");

            const shMatch = shContent.match(/PINNED_HELPER_SHA256="([a-f0-9]{64})"/);
            const ps1Match = ps1Content.match(/\$PINNED_HELPER_SHA256\s*=\s*"([a-f0-9]{64})"/);

            if (!shMatch || shMatch[1] !== helperSha) {
              console.error(`::error::install.sh PINNED_HELPER_SHA256 (${shMatch?.[1]}) does not match helper SHA (${helperSha})`);
              process.exit(1);
            }
            if (!ps1Match || ps1Match[1] !== helperSha) {
              console.error(`::error::install.ps1 PINNED_HELPER_SHA256 (${ps1Match?.[1]}) does not match helper SHA (${helperSha})`);
              process.exit(1);
            }
            console.log("Deterministic helper build and pinned installer digests verified successfully.");
          '

          candidate_stage="$(mktemp -d)"
          trap 'rm -rf "$candidate_stage"' EXIT

          mkdir -p "$candidate_stage/release" "$candidate_stage/qualification" "$candidate_stage/tools" "$candidate_stage/installers" "$candidate_stage/packages"
          cp -a "dist/release/${RELEASE_TAG}" "$candidate_stage/release/"
          cp -a dist/qualification/* "$candidate_stage/qualification/"
          cp -a scripts/publish-public-release.mjs "$candidate_stage/tools/"
          cp -a scripts/package-release.mjs scripts/generate-release-evidence.mjs "$candidate_stage/tools/"
          cp -a scripts/release-trust.mjs "$candidate_stage/tools/"
          cp -a apps/cli/install/install.sh "$candidate_stage/installers/"
          cp -a apps/cli/install/install.ps1 "$candidate_stage/installers/"
          cp -a apps/cli/install/install-helper-v1.mjs "$candidate_stage/installers/"
          cp -a dist/release-packages/. "$candidate_stage/packages/"

          tar --sort=name --mtime='2026-01-01 00:00:00Z' --owner=0 --group=0 --numeric-owner \
            -czf resin-release-candidate.tar.gz -C "$candidate_stage" release qualification tools installers packages

          sha256sum resin-release-candidate.tar.gz > resin-release-candidate.tar.gz.sha256
          sha256sum -c resin-release-candidate.tar.gz.sha256

      - name: Upload verified release candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resin-release-candidate-${{ inputs.commit_sha }}
          path: |
            resin-release-candidate.tar.gz
            resin-release-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
