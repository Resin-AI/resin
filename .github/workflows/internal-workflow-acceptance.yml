name: Internal workflow acceptance

on:
  push:
    branches: [gwc2-work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-workflow-${{ github.ref }}
  cancel-in-progress: true

# Tests, qualification and smoke runs start real Resin binaries; they never send error reports
# or usage events (see docs/adr/0015-client-error-reporting.md).
env:
  DO_NOT_TRACK: "1"

jobs:
  capture-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve exact tested source
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/workflow-source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-source-${{ github.sha }}
          path: ${{ runner.temp }}/workflow-source.tar
          retention-days: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Preserve isolated replay runtime
        run: |
          pnpm --filter @resin/runtime deploy --legacy --prod "$RUNNER_TEMP/replay-runtime"
          tar -czf "$RUNNER_TEMP/replay-runtime.tgz" -C "$RUNNER_TEMP/replay-runtime" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/replay-runtime.tgz
          retention-days: 1
      - name: Capture, local privacy, and replay regressions
        run: |
          umask 022
          pnpm exec vitest run --no-file-parallelism --maxWorkers=1 apps/observer/tests/normalization apps/observer/tests/analytics packages/runtime/tests/workflow apps/gateway/tests/proxy/validation-worker.test.ts apps/gateway/tests/proxy/validation-unavailable.test.ts apps/gateway/tests/proxy/workflow-slice-reuse.test.ts
