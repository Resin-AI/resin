version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Must equal pnpm-workspace.yaml minimumReleaseAge (4320 minutes): Dependabot passes this
    # cooldown to pnpm, which then rejects any locked registry version younger than it.
    cooldown:
      default-days: 3
    groups:
      workspace-minor-and-patch:
        update-types:
          - minor
          - patch
        # The OMP SDK is pinned to the OMP release Resin qualified (OMP_TESTED_VERSIONS in
        # adapters/omp/src/discovery.ts). A bump needs that release's recorded fixtures, so it gets
        # its own pull request instead of riding along with unrelated updates.
        exclude-patterns:
          - "@oh-my-pi/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
