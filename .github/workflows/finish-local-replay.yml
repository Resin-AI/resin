name: Verify and finish local replay correction

on:
  push:
    branches: [gwc2-work]
    paths: [.ci/finish-local-replay.py, .github/workflows/finish-local-replay.yml]

permissions:
  contents: write

jobs:
  verified-correction:
    if: github.repository == 'Resin-AI/resin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: resin_test
          POSTGRES_USER: resin_test
          POSTGRES_PASSWORD: resin_test_password
        ports: [5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply guarded source correction
        run: |
          set -euo pipefail
          python3 .ci/finish-local-replay.py
          git rm .ci/finish-local-replay.py .github/workflows/finish-local-replay.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: '2.9.5'
      - name: Verify changed source and full unit suite
        env:
          TEST_DATABASE_URL: postgresql://resin_test:resin_test_password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/resin_test
        run: |
          set -euo pipefail
          umask 022
          pnpm install --frozen-lockfile
          pnpm exec biome check --write apps/observer/src/analytics/private-value-store.ts apps/observer/src/analytics/workflow-call-recorder.ts apps/observer/src/normalization/local-workflow-payload.ts apps/observer/src/normalization/pipeline.ts apps/observer/tests/analytics/immutable-private-store.test.ts apps/observer/tests/analytics/workflow-private-replay.test.ts apps/observer/tests/analytics/native-supporting-results.test.ts packages/runtime/tests/workflow/native-private-reuse.test.mjs
          pnpm build
          pnpm exec vitest run apps/observer/tests/normalization apps/observer/tests/analytics packages/runtime/tests/workflow
          pnpm typecheck
          pnpm lint
          pnpm test
          git add apps/observer/src apps/observer/tests/analytics packages/runtime/tests/workflow/native-private-reuse.test.mjs
      - name: Fast-forward verified source only if the branch is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD=$(gh api repos/Resin-AI/resin/git/ref/heads/gwc2-work --jq .object.sha)
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(observer): preserve exact local workflow payloads through immutable references' -m 'Build, replay regressions, typecheck, lint, and full unit suite passed before this fast-forward. No merge, release, or deployment.'
          gh auth setup-git
          git push origin HEAD:refs/heads/gwc2-work
          git rev-parse HEAD
