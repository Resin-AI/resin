name: Production Security Scan

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact release candidate SHA to scan
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-security-scan-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: resin-vm-linux-arm64
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/security-scan
          pnpm audit --prod --audit-level high --json > dist/security-scan/pnpm-audit.json

      - name: Build exact cloud container
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: docker build --build-arg APP_VERSION="$TARGET_SHA" -f apps/cloud/Dockerfile -t "resin-cloud-scan:$TARGET_SHA" .

      - name: Scan cloud container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: resin-cloud-scan:${{ inputs.commit_sha }}
          format: json
          output: dist/security-scan/trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

      - name: Generate retained scan evidence
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          node --input-type=module -e '
            import crypto from "node:crypto";
            import fs from "node:fs";
            const audit = fs.readFileSync("dist/security-scan/pnpm-audit.json");
            const trivy = fs.readFileSync("dist/security-scan/trivy.json");
            const generatedAt = new Date();
            const parsed = JSON.parse(trivy);
            const vulnerabilities = (parsed.Results || []).flatMap((result) =>
              (result.Vulnerabilities || []).map((finding) => ({
                id: finding.VulnerabilityID,
                ratings: [{ severity: String(finding.Severity || "unknown").toLowerCase() }],
                affects: [{ ref: finding.PkgIdentifier?.PURL || finding.PkgName || "unknown" }],
              })),
            );
            const evidence = {
              schemaVersion: "1.0.0",
              source: "pnpm-audit+trivy-container",
              generatedAt: generatedAt.toISOString(),
              retentionUntil: new Date(generatedAt.getTime() + 365 * 24 * 60 * 60 * 1000).toISOString(),
              commitSha: process.env.RELEASE_SHA,
              dependencyScan: { status: "COMPLETED", rawSha256: crypto.createHash("sha256").update(audit).digest("hex") },
              containerScan: { status: "COMPLETED", rawSha256: crypto.createHash("sha256").update(trivy).digest("hex") },
              vulnerabilities,
            };
            fs.writeFileSync("dist/security-scan/vulnerability-scan-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          '

      - name: Upload retained security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-scan-evidence
          path: dist/security-scan/
          if-no-files-found: error
          retention-days: 365
