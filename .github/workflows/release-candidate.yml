name: Release Candidate

# One dispatch per release, sent as soon as the commit lands on main. Platform and
# system qualification run here, in parallel, against the exact commit; the ci.yml
# push run for the same commit runs concurrently and release.yml refuses to
# promote until that recorded CI run has completed successfully.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit SHA to build release candidate for
        required: true
        type: string
      release_tag:
        description: Exact protected release tag for this candidate
        required: true
        type: string
      ci_run_id:
        description: GitHub Actions run ID of the ci.yml push run on exact commit_sha (may still be running; release.yml requires it to succeed)
        required: true
        type: string

concurrency:
  group: release-candidate-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  platform-qualification:
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - lanes: linux-x64
            check_name: Qualify linux-x64
            mode: native
            runner: ubuntu-latest
          - lanes: linux-arm64
            check_name: Qualify linux-arm64
            mode: native
            runner: ubuntu-24.04-arm
          - lanes: darwin-x64 darwin-arm64 wsl
            check_name: Validate darwin-x64, darwin-arm64 and wsl artifacts
            mode: artifact
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RESIN_RELEASE_TEST_ONLY: "1"
      RELEASE_SHA: ${{ inputs.commit_sha }}
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - name: Locate turbo cache
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-cache" >> "$GITHUB_ENV"

      - name: Restore turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-release-${{ inputs.commit_sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-release-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact candidate
        run: pnpm build

      - name: Package signed test-domain release candidate
        run: pnpm release:package

      - name: Validate artifact or exercise native packaged stack on GitHub-hosted Linux
        shell: bash
        env:
          LANES: ${{ matrix.lanes }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          for lane in $LANES; do
            node scripts/platform-qualification.mjs --lane="$lane" --mode="$MODE" \
              --release-dir=dist/release/v1.0.3 --output-dir=dist/qualification
            mkdir -p dist/platform-evidence
            cp "dist/qualification/$lane.json" dist/platform-evidence/
          done

      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-qualification-${{ strategy.job-index }}
          path: dist/platform-evidence/
          if-no-files-found: error
          retention-days: 30

  system-qualification:
    name: Clean Checkout Public Core System Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RESIN_RELEASE_TEST_ONLY: "1"
      RELEASE_SHA: ${{ inputs.commit_sha }}
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - name: Locate turbo cache
        run: echo "TURBO_CACHE_DIR=$RUNNER_TEMP/turbo-cache" >> "$GITHUB_ENV"

      - name: Restore turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-release-${{ inputs.commit_sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-release-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact candidate
        run: pnpm build

      # The suites don't read the packaged release, so package and verify it
      # concurrently; the evidence is bound to it once both have finished.
      - name: Package release candidate and run release-bound public core qualification
        shell: bash
        run: |
          set -euo pipefail
          ready="$RUNNER_TEMP/release-ready"
          ( set +e; pnpm release:package && pnpm release:verify; echo $? > "$ready" ) > "$RUNNER_TEMP/package.log" 2>&1 &
          package_pid=$!
          status=0
          node scripts/system-qualification.mjs \
            --release-dir=dist/release/v1.0.3 \
            --output=dist/qualification/system-e2e.json \
            --commit-sha="$RELEASE_SHA" \
            --release-ready-file="$ready" || status=$?
          wait "$package_pid" || true
          cat "$RUNNER_TEMP/package.log"
          exit "$status"

      - name: Upload system qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-qualification-evidence
          path: dist/qualification/system-e2e.json
          if-no-files-found: error
          retention-days: 30

  build-and-sign:
    name: Build and Sign Candidate
    needs: [platform-qualification, system-qualification]
    runs-on: resin-vm-linux-arm64
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: none
    env:
      RELEASE_SHA: ${{ inputs.commit_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RESIN_RELEASE_KEY_ID: ${{ vars.RESIN_RELEASE_KEY_ID }}
      RESIN_RELEASE_PUBLIC_KEY_PEM: ${{ vars.RESIN_RELEASE_PUBLIC_KEY_PEM }}
      RESIN_RELEASE_ADDITIONAL_TRUSTED_KEYS_JSON: ${{ vars.RESIN_RELEASE_ADDITIONAL_TRUSTED_KEYS_JSON }}
      RESIN_RELEASE_EVIDENCE_PATH: dist/qualification/production-release-evidence.json
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify exact commit SHA and CI run identity
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid commit SHA format: $RELEASE_SHA"
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag format: $RELEASE_TAG"
            exit 1
          fi

          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$RELEASE_SHA" ]; then
            echo "::error::Checked out HEAD ($actual_head) does not match requested commit SHA ($RELEASE_SHA)"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_target" != "$RELEASE_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG points to $tag_target, not candidate SHA $RELEASE_SHA"
              exit 1
            fi
          fi

          node --input-type=module -e '
            import { REVOKED_RELEASE_KEY_IDS } from "./scripts/release-trust.mjs";
            const privateKey = process.env.RESIN_RELEASE_PRIVATE_KEY_PEM || "";
            if (privateKey && privateKey.includes("resin-release-v1")) {
              console.error("::error::Revoked signing key rejected for candidate build");
              process.exit(1);
            }
          '

          # The CI run may still be in progress (it runs concurrently with this
          # workflow); a finished run must have succeeded. The next step waits for
          # it to succeed before any evidence is generated, and release.yml
          # re-checks it before promotion.
          validate_run() {
            local run_id="$1"
            local expected_path="$2"
            local label="$3"
            local run_info

            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::$label run ID must be digits: $run_id"
              exit 1
            fi

            echo "Validating $label (run $run_id)..."
            run_info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            run_repo="$(echo "$run_info" | jq -r '.head_repository.full_name // (.head_repository_owner.login + "/" + .head_repository.name)')"
            run_path="$(echo "$run_info" | jq -r '.path')"
            run_sha="$(echo "$run_info" | jq -r '.head_sha')"
            run_event="$(echo "$run_info" | jq -r '.event')"
            run_branch="$(echo "$run_info" | jq -r '.head_branch')"
            run_status="$(echo "$run_info" | jq -r '.status')"
            run_conclusion="$(echo "$run_info" | jq -r '.conclusion')"

            if [ "$run_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::$label run $run_id repository ($run_repo) does not match $GITHUB_REPOSITORY"
              exit 1
            fi

            if [ "$run_path" != "$expected_path" ]; then
              echo "::error::$label run $run_id workflow path ($run_path) does not match expected ($expected_path)"
              exit 1
            fi

            if [ "$run_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$label run $run_id head SHA ($run_sha) does not match release SHA ($RELEASE_SHA)"
              exit 1
            fi

            if [ "$run_event" != "push" ] || [ "$run_branch" != "main" ]; then
              echo "::error::$label run $run_id is a $run_event run on $run_branch (must be a push to main)"
              exit 1
            fi

            if [ "$run_status" = "completed" ] && [ "$run_conclusion" != "success" ]; then
              echo "::error::$label run $run_id conclusion is $run_conclusion (must be success)"
              exit 1
            fi
            echo "$label run $run_id accepted ($run_status)"
          }

          validate_run "$CI_RUN_ID" ".github/workflows/ci.yml" "CI suite"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact-SHA CI run to succeed
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while :; do
            run_info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
            run_repo="$(echo "$run_info" | jq -r '.head_repository.full_name // (.head_repository_owner.login + "/" + .head_repository.name)')"
            run_path="$(echo "$run_info" | jq -r '.path')"
            run_sha="$(echo "$run_info" | jq -r '.head_sha')"
            run_event="$(echo "$run_info" | jq -r '.event')"
            run_branch="$(echo "$run_info" | jq -r '.head_branch')"
            run_status="$(echo "$run_info" | jq -r '.status')"
            run_conclusion="$(echo "$run_info" | jq -r '.conclusion')"
            if [ "$run_repo" != "$GITHUB_REPOSITORY" ] || [ "$run_path" != ".github/workflows/ci.yml" ] || [ "$run_sha" != "$RELEASE_SHA" ] || [ "$run_event" != "push" ] || [ "$run_branch" != "main" ]; then
              echo "::error::CI run $CI_RUN_ID ($run_repo $run_path $run_event $run_branch $run_sha) is not the ci.yml push to main on $RELEASE_SHA"
              exit 1
            fi
            if [ "$run_status" = "completed" ]; then
              if [ "$run_conclusion" != "success" ]; then
                echo "::error::CI run $CI_RUN_ID concluded $run_conclusion (must be success)"
                exit 1
              fi
              echo "CI run $CI_RUN_ID succeeded on $RELEASE_SHA"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::CI run $CI_RUN_ID still $run_status after 15 minutes"
              exit 1
            fi
            sleep 5
          done

      - name: Download platform qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: platform-qualification-*
          merge-multiple: true
          path: dist/upstream-qualification/platform

      - name: Download system qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: system-qualification-evidence
          path: dist/upstream-qualification/system

      - name: Require evidence for every qualification lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist/upstream-qualification/platform -name '*.json' -type f | wc -l)" -eq 5
          test -s dist/upstream-qualification/system/system-e2e.json

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/security-scan
          pnpm audit --prod --audit-level high --json > dist/security-scan/pnpm-audit.json

      - name: Generate retained vulnerability scan evidence
        run: |
          node --input-type=module -e '
            import crypto from "node:crypto";
            import fs from "node:fs";
            const audit = fs.readFileSync("dist/security-scan/pnpm-audit.json");
            const generatedAt = new Date();
            const parsed = JSON.parse(audit);
            const vulnerabilities = Object.values(parsed.vulnerabilities || {}).map((finding) => {
              const advisory = (finding.via || []).find((item) => typeof item === "object");
              return {
                id: String(advisory?.source || `pnpm:${finding.name || "unknown"}`),
                ratings: [{ severity: String(finding.severity || "unknown").toLowerCase() }],
                affects: [{ ref: finding.name || "unknown" }],
              };
            });
            const evidence = {
              schemaVersion: "1.0.0",
              source: "pnpm-audit",
              generatedAt: generatedAt.toISOString(),
              retentionUntil: new Date(generatedAt.getTime() + 365 * 24 * 60 * 60 * 1000).toISOString(),
              commitSha: process.env.RELEASE_SHA,
              dependencyScan: { status: "COMPLETED", rawSha256: crypto.createHash("sha256").update(audit).digest("hex") },
              containerScan: {
                status: "NOT_APPLICABLE",
                reason: "The public local-core release does not publish a container artifact",
              },
              vulnerabilities,
            };
            fs.writeFileSync("dist/security-scan/vulnerability-scan-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          '
          test -s dist/security-scan/vulnerability-scan-evidence.json

      - name: Generate production qualification evidence
        run: >-
          node scripts/generate-production-qualification-evidence.mjs
          --ci-run-id=${{ steps.gates.outputs.ci_run_id }}
          --platform-run-id=${{ github.run_id }}
          --system-run-id=${{ github.run_id }}
          --security-run-id=${{ github.run_id }}
          --commit-sha=$RELEASE_SHA
          --output=$RESIN_RELEASE_EVIDENCE_PATH

      - name: Require qualification for every production platform
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const evidence = JSON.parse(fs.readFileSync(process.env.RESIN_RELEASE_EVIDENCE_PATH, "utf8"));
            const lanes = new Map(
              (evidence.qualification?.platforms?.lanes || []).map((lane) => [lane.id, lane]),
            );
            const required = ["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64"];
            for (const platform of required) {
              const status = lanes.get(platform)?.status;
              if (!["QUALIFIED", "ARTIFACT_VALIDATED"].includes(status)) {
                console.error(`::error::Platform ${platform} qualification status is ${status || "missing"}`);
                process.exit(1);
              }
            }
          '

      - name: Package exact production-signed release
        env:
          RESIN_VULNERABILITY_SCAN_PATH: dist/security-scan/vulnerability-scan-evidence.json
          RESIN_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.RESIN_RELEASE_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-release.mjs

      - name: Package public fallback tarballs
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/release-packages"
          pnpm run release:packages -- \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --output-dir "$package_dir"
          test -s "$package_dir/packages-manifest.json"
          mapfile -t package_tarballs < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#package_tarballs[@]}" -ne 19 ]; then
            echo "::error::Expected exactly 19 public fallback package tarballs, found ${#package_tarballs[@]}"
            exit 1
          fi

      - name: Mirror runtime sources upstream
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-public-release.mjs mirror-runtimes --dist-dir "dist/release/${RELEASE_TAG}"
      - name: Stage and verify all pinned runtime archives
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="dist/runtimes/deno-v2.9.5"
          release_dir="dist/release/${RELEASE_TAG}"
          mapfile -t runtimes < <(find "$runtime_dir" -maxdepth 1 -type f -name '*.zip' -print)
          if [ "${#runtimes[@]}" -ne 4 ]; then
            echo "::error::Expected exactly four pinned Deno runtime ZIPs, found ${#runtimes[@]}"
            exit 1
          fi
          cp "${runtimes[@]}" "$release_dir/"
          for runtime in "${runtimes[@]}"; do
            test -s "$release_dir/$(basename "$runtime")"
          done

      - name: Verify candidate integrity and signatures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-public-release.mjs verify-candidate --dist-dir "dist/release/${RELEASE_TAG}"

      - name: Assemble deterministic release candidate archive
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying deterministic install helper build and pinned digests..."
          node scripts/build-install-helper.mjs --check

          node --input-type=module -e '
            import crypto from "node:crypto";
            import fs from "node:fs";

            const helperContent = fs.readFileSync("apps/cli/install/install-helper-v1.mjs");
            const helperSha = crypto.createHash("sha256").update(helperContent).digest("hex");

            const shContent = fs.readFileSync("apps/cli/install/install.sh", "utf8");
            const ps1Content = fs.readFileSync("apps/cli/install/install.ps1", "utf8");

            const shMatch = shContent.match(/PINNED_HELPER_SHA256="([a-f0-9]{64})"/);
            const ps1Match = ps1Content.match(/\$PINNED_HELPER_SHA256\s*=\s*"([a-f0-9]{64})"/);

            if (!shMatch || shMatch[1] !== helperSha) {
              console.error(`::error::install.sh PINNED_HELPER_SHA256 (${shMatch?.[1]}) does not match helper SHA (${helperSha})`);
              process.exit(1);
            }
            if (!ps1Match || ps1Match[1] !== helperSha) {
              console.error(`::error::install.ps1 PINNED_HELPER_SHA256 (${ps1Match?.[1]}) does not match helper SHA (${helperSha})`);
              process.exit(1);
            }
            console.log("Deterministic helper build and pinned installer digests verified successfully.");
          '

          candidate_stage="$(mktemp -d)"
          trap 'rm -rf "$candidate_stage"' EXIT

          mkdir -p "$candidate_stage/release" "$candidate_stage/qualification" "$candidate_stage/tools" "$candidate_stage/installers" "$candidate_stage/packages"
          cp -a "dist/release/${RELEASE_TAG}" "$candidate_stage/release/"
          cp -a dist/qualification/* "$candidate_stage/qualification/"
          cp -a scripts/publish-public-release.mjs "$candidate_stage/tools/"
          cp -a scripts/package-release.mjs scripts/generate-release-evidence.mjs "$candidate_stage/tools/"
          cp -a scripts/release-trust.mjs "$candidate_stage/tools/"
          cp -a apps/cli/install/install.sh "$candidate_stage/installers/"
          cp -a apps/cli/install/install.ps1 "$candidate_stage/installers/"
          cp -a apps/cli/install/install-helper-v1.mjs "$candidate_stage/installers/"
          cp -a dist/release-packages/. "$candidate_stage/packages/"

          tar --sort=name --mtime='2026-01-01 00:00:00Z' --owner=0 --group=0 --numeric-owner \
            -czf resin-release-candidate.tar.gz -C "$candidate_stage" release qualification tools installers packages

          sha256sum resin-release-candidate.tar.gz > resin-release-candidate.tar.gz.sha256
          sha256sum -c resin-release-candidate.tar.gz.sha256

      - name: Upload verified release candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resin-release-candidate-${{ inputs.commit_sha }}
          path: |
            resin-release-candidate.tar.gz
            resin-release-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
